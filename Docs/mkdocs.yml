site_name: Autonomous Car 2026
site_url: https://Vladislav-Levovitch-Polytech-Sorbonne.github.io/Projet_Industriel_2026/
repo_url: https://github.com/Vladislav-Levovitch-Polytech-Sorbonne/Projet_Industriel_2026
repo_name: GitHub

# 1. Directory Setup
docs_dir: .
site_dir: ../site

# 2. Theme Configuration
theme:
  name: material
  # custom_dir: overrides # Optional, keep if you do advanced HTML overrides later
  logo: assets/images/favicon.png
  favicon: assets/images/favicon.png

    
  font:
    text: Roboto    # Clean and professional
    code: JetBrains Mono  # Excellent for reading code
  
  # ENABLE SEARCH SHORTCUTS & FEATURES
  features:
    # - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest   # Adds suggestions while typing
    - search.highlight # Highlights the found word
    - search.share     # Adds a share button for search results
    - content.code.copy  # Adds a copy button to code blocks

  # LIGHT / DARK MODE TOGGLE + CUSTOM COLOR
  palette: 
    # Light Mode
    - scheme: default
      primary: custom  # <--- This tells it to look at your extra.css
      accent: indigo
      toggle:
        icon: material/brightness-7 
        name: Switch to Dark Mode

    # Dark Mode
    - scheme: slate 
      primary: custom  # <--- This tells it to look at your extra.css
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to Light Mode

# 3. Link the Custom CSS
extra_css:
  - ./stylesheets/extra.css

# # 4. Plugins (Search + Exclude + i18n)
plugins:
  - glightbox
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
        - locale: fr
          name: Français
        - locale: zh
          name: 中文
  - exclude:
      glob:
        - "site/**/*"
        - ".git/**/*"
        - ".github/**/*"
        - "requirements.txt"
        - "LICENSE"
        - "**/*.py"
        - "**/*.c"
        - "**/*.cpp"
        - "**/*.h"
        - "./mkdocs.yml" 
        - "./stylesheets/**/*"
        - "README.md"

# 5. Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  # - pymdownx.tabbed:
  #     alternate_style: true

# 6. Navigation
nav:
  - Home: index.md
  # - Project Overview: project_overview.md 
  - Technical Documentation:
    - Firmware: Firmware.md
  #   - Hardware: Hardware.md
  #   - Mechanical: Mechanical.md
  #   - Software: Software.md